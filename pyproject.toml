[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-experiment-knowledge"
version = "0.7.0b1"
description = "Private, platform-independent post-experiment records, synthesis, and report maintenance"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
expkm = "expkm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
